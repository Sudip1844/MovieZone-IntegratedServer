# netlify.toml — Netlify deployment configuration for MovieZone Frontend
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/
# Location: static/netlify.toml
# Netlify publish dir is "." because this file is already inside static/

[build]
  # This file lives inside static/ — so publish current dir
  publish = "."

# Redirect all API calls to Render backend
# ⬇️ Replace YOUR_RENDER_SERVICE with your actual Render URL after deployment
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_RENDER_SERVICE.onrender.com/api/:splat"
  status = 200
  force = true

# Redirect /sudip (owner panel) to backend-served page
[[redirects]]
  from = "/sudip"
  to = "https://YOUR_RENDER_SERVICE.onrender.com/sudip"
  status = 200
  force = true

# Redirect /admin to backend-served page
[[redirects]]
  from = "/admin"
  to = "https://YOUR_RENDER_SERVICE.onrender.com/admin"
  status = 200
  force = true

# Redirect /m/<short_id> to backend for movie shortlinks
[[redirects]]
  from = "/m/*"
  to = "https://YOUR_RENDER_SERVICE.onrender.com/m/:splat"
  status = 200
  force = true

# Redirect /ad_page.html to backend
[[redirects]]
  from = "/ad_page.html"
  to = "https://YOUR_RENDER_SERVICE.onrender.com/ad_page.html"
  status = 200
  force = true

# SPA fallback — serve index.html for unknown routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
